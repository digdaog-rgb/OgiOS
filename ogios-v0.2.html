<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>OgiOS v0.2</title>
<style>
:root{--bg:#111827;--panel:#1b2639;--panel2:#202d43;--text:#f4f6ff;--muted:#aab5c8;--line:#ffffff20;--accent:#91a4ff;--task:rgba(10,15,26,.88)}
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);user-select:none}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
#desktop{height:100dvh;width:100vw;position:relative;overflow:hidden;background:radial-gradient(ellipse at 20% 15%,#34466e 0,transparent 38%),linear-gradient(135deg,#111827,#1c2b43 65%,#101b2b)}
.brand{position:absolute;top:20px;left:22px;font-size:12px;letter-spacing:.2em;font-weight:800;color:#e8edffb8}
#icons{position:absolute;top:65px;left:14px;display:grid;gap:8px}
.deskicon{width:76px;min-height:72px;border:1px solid transparent;background:transparent;border-radius:12px;display:grid;place-items:center;align-content:center;gap:4px;font-size:11px}
.deskicon:hover,.deskicon.selected{background:#ffffff18;border-color:#ffffff20}.deskicon b{font-size:26px;font-weight:400}
#workspace{position:absolute;inset:0 0 56px;pointer-events:none}
.win{position:absolute;left:100px;top:80px;width:min(510px,calc(100vw - 24px));height:min(390px,calc(100dvh - 125px));min-width:260px;min-height:190px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:0 12px 32px #0004;pointer-events:auto}
.titlebar{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 13px;background:var(--panel2);border-bottom:1px solid var(--line);touch-action:none}
.wtitle{font-size:12px;font-weight:700}.controls{display:flex;gap:5px}.controls button{width:27px;height:25px;border:0;border-radius:6px;background:#ffffff12}.controls .x:hover{background:#c8445c}
.wbody{padding:14px;overflow:auto;flex:1;min-height:0;user-select:text}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--task);border-top:1px solid var(--line)}
#start{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#ffffff12;font-weight:800}
#running{display:flex;gap:5px;flex:1;overflow:auto}.taskapp{height:36px;min-width:38px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:#ffffff10;font-size:12px;white-space:nowrap}.taskapp.active{border-color:var(--accent);background:#91a4ff25}
#clock{font-size:11px;line-height:1.4;text-align:right;min-width:65px}
#menu{display:none;position:absolute;bottom:65px;left:10px;width:min(280px,calc(100vw - 20px));padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 35px #0006;z-index:9999}
#menu.open{display:block}.menutitle{padding:5px 7px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.menutitle strong{display:block}.menutitle small{color:var(--muted)}
.menuitem{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13px}.menuitem:hover{background:#ffffff12}
h2{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);margin:0 0 14px}
input,textarea{color:var(--text);background:#101827;border:1px solid var(--line);border-radius:8px;padding:9px;outline:none}input:focus,textarea:focus{border-color:var(--accent)}
.primary,.smallbtn{border:0;border-radius:8px;padding:8px 11px;background:var(--accent);color:#111827;font-weight:700}.smallbtn{font-size:12px;padding:6px 9px}.danger{background:#b94359;color:white}
.row{display:flex;gap:7px;align-items:center}.row>*{min-width:0}.grow{flex:1}
.noteslayout,.fileslayout{display:flex;gap:10px;height:100%;min-height:220px}.side{width:125px;flex:0 0 125px;border-right:1px solid var(--line);padding-right:8px;overflow:auto}.side button{display:block;width:100%;padding:8px;margin:2px 0;text-align:left;font-size:11px;border:0;border-radius:7px;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side button.active,.side button:hover{background:#ffffff16}.editor{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.editor textarea{width:100%;flex:1;min-height:130px;resize:none}.editor input{width:100%}
.filelist{flex:1;min-width:0;overflow:auto}.fileitem{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:9px;border-bottom:1px solid var(--line);font-size:12px}.fileitem button{font-size:11px;border:0;background:#ffffff12;border-radius:6px;padding:5px 7px}
.calc{max-width:320px;margin:auto}.display{width:100%;height:52px;text-align:right;font-size:22px;margin:6px 0 9px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.keys button{height:43px;border:1px solid var(--line);border-radius:8px;background:#ffffff10}.keys button:hover{background:#ffffff20}.keys .eq{background:var(--accent);color:#111827;font-weight:800}.keys .util{background:#ffffff20}
.settingrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
#toast{position:absolute;right:12px;bottom:68px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-size:12px;opacity:0;transition:.18s;pointer-events:none}#toast.show{opacity:1}
body.light{--panel:#f3f5fc;--panel2:#e5eaf6;--text:#192238;--muted:#58647b;--line:#1b2b491f;--task:rgba(235,240,250,.94);background:#dce5f7}
body.light #desktop{background:radial-gradient(ellipse at 20% 15%,#c1d0f3 0,transparent 38%),linear-gradient(135deg,#e9effa,#cbd9ed)}
body.light input,body.light textarea{background:#fff;color:#192238}
body.light .brand{color:#34415c}
@media(max-width:600px){.brand{top:15px;left:15px}.deskicon{width:66px;min-height:65px}#icons{left:7px;top:55px;gap:4px}.win{left:10px;top:75px;width:calc(100vw - 20px);height:min(440px,calc(100dvh - 145px))}#taskbar{padding:0 7px;gap:5px}.side{width:105px;flex-basis:105px}}
</style>
</head>
<body>
<main id="desktop">
 <div class="brand">OGIOS <span style="font-weight:400;opacity:.65">/ PERSONAL SPACE</span></div>
 <div id="icons">
  <button class="deskicon" data-open="notes"><b>📝</b>OgiNotes</button>
  <button class="deskicon" data-open="calculator"><b>🧮</b>Calculator</button>
  <button class="deskicon" data-open="files"><b>📁</b>OgiFiles</button>
  <button class="deskicon" data-open="settings"><b>⚙️</b>Settings</button>
 </div>
 <section id="workspace"></section>
 <nav id="taskbar"><button id="start">◈ Ogi</button><div id="running"></div><div id="clock"></div></nav>
 <section id="menu"><div class="menutitle"><strong>OgiOS</strong><small>Personal Web Environment · v0.2 Alpha</small></div>
  <button class="menuitem" data-open="notes">📝 OgiNotes</button><button class="menuitem" data-open="calculator">🧮 Calculator</button><button class="menuitem" data-open="files">📁 OgiFiles</button><button class="menuitem" data-open="settings">⚙️ Settings</button>
 </section><div id="toast"></div>
</main>
<script>
const $=s=>document.querySelector(s), workspace=$('#workspace'), running=$('#running'), menu=$('#menu');
const apps={notes:['📝','OgiNotes',480,360],calculator:['🧮','Calculator',340,390],files:['📁','OgiFiles',460,350],settings:['⚙️','Settings',390,300]};
const opened=new Map();let z=10,seq=0;
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1700)}
function content(id){if(id==='notes')return `<h2>OgiNotes</h2><p class="sub">Buat banyak catatan. Perubahan tersimpan otomatis.</p><div class="noteslayout"><aside class="side" id="note-list"></aside><div class="editor"><div class="row"><input id="note-title" placeholder="Judul catatan" class="grow"><button class="smallbtn" id="new-note">＋</button></div><textarea id="note-body" placeholder="Mulai menulis..."></textarea><div class="row"><small class="sub grow" id="note-status">Autosave aktif</small><button class="smallbtn danger" id="delete-note">Hapus</button></div></div></div>`;
if(id==='calculator')return `<div class="calc"><h2>Calculator</h2><p class="sub">Operasi dasar dengan prioritas perkalian dan pembagian.</p><input class="display" id="calc-display" value="0" readonly><div class="keys">${['AC','DEL','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','+','='].map(k=>`<button class="${['AC','DEL'].includes(k)?'util':''} ${k==='='?'eq':''}" data-key="${k}">${k}</button>`).join('')}</div></div>`;
if(id==='files')return `<h2>OgiFiles</h2><p class="sub">File teks sederhana yang disimpan di browser ini.</p><div class="row"><input id="file-name" class="grow" placeholder="Nama file baru"><button class="smallbtn" id="create-file">＋ Buat</button></div><div class="fileslayout" style="margin-top:12px"><aside class="side" id="folder-list"><button class="active">📁 My Files</button></aside><div class="filelist" id="file-list"></div></div><div id="file-editor" style="display:none;margin-top:10px"><input id="edit-file-name" style="width:100%;margin-bottom:6px"><textarea id="edit-file-body" style="width:100%;height:100px;resize:vertical"></textarea><div class="row" style="margin-top:6px"><button class="smallbtn" id="save-file">Simpan</button><button class="smallbtn danger" id="remove-file">Hapus</button><button class="smallbtn" id="download-file">Unduh</button></div></div>`;
return `<h2>Settings</h2><p class="sub">Pengaturan OgiOS.</p><div class="settingrow"><span>Tampilan</span><button class="smallbtn" id="theme">Ganti tema</button></div><div class="settingrow"><span>Versi</span><b>0.2 Alpha</b></div><div class="settingrow"><span>Penyimpanan</span><b>Local browser</b></div><p class="sub" style="margin-top:14px">Catatan dan file disimpan pada browser/perangkat ini, bukan cloud.</p>`}
function openApp(id){menu.classList.remove('open');if(opened.has(id)){let w=opened.get(id);w.style.display='flex';focus(w);return}seq++;let a=apps[id],w=document.createElement('article');w.className='win';w.dataset.id=id;w.style.width=`min(${a[2]}px,calc(100vw - 20px))`;w.style.height=`min(${a[3]}px,calc(100dvh - 110px))`;w.style.left=Math.max(8,75+(seq-1)*18)+'px';w.style.top=Math.max(55,65+(seq-1)*15)+'px';w.innerHTML=`<header class="titlebar"><span class="wtitle">${a[0]} ${a[1]}</span><div class="controls"><button class="min">−</button><button class="max">□</button><button class="x">×</button></div></header><div class="wbody">${content(id)}</div>`;workspace.append(w);opened.set(id,w);let t=document.createElement('button');t.className='taskapp active';t.dataset.id=id;t.textContent=a[0]+' '+a[1];t.onclick=()=>{w.style.display='flex';focus(w)};running.append(t);focus(w);wireWindow(w,id);if(id==='notes')initNotes(w);if(id==='calculator')initCalc(w);if(id==='files')initFiles(w);if(id==='settings')$('#theme',w).onclick=()=>document.body.classList.toggle('light')}
function focus(w){w.style.zIndex=++z;document.querySelectorAll('.taskapp').forEach(b=>b.classList.toggle('active',b.dataset.id===w.dataset.id))}
function close(id){opened.get(id)?.remove();opened.delete(id);$(`.taskapp[data-id="${id}"]`)?.remove()}
function wireWindow(w,id){w.addEventListener('pointerdown',()=>focus(w));$('.x',w).onclick=()=>close(id);$('.min',w).onclick=()=>{w.style.display='none';$(`.taskapp[data-id="${id}"]`)?.classList.remove('active')};$('.max',w).onclick=()=>{if(w.dataset.max==='1'){w.style.cssText=w.dataset.old;w.dataset.max='0'}else{w.dataset.old=`left:${w.style.left};top:${w.style.top};width:${w.style.width};height:${w.style.height};`;w.style.left='8px';w.style.top='8px';w.style.width='calc(100% - 16px)';w.style.height='calc(100% - 16px)';w.dataset.max='1'}};let bar=$('.titlebar',w),sx,sy,l,t,drag=false;bar.onpointerdown=e=>{if(e.target.closest('button')||w.dataset.max==='1')return;drag=true;sx=e.clientX;sy=e.clientY;l=w.offsetLeft;t=w.offsetTop;bar.setPointerCapture(e.pointerId)};bar.onpointermove=e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-90,l+e.clientX-sx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-90,t+e.clientY-sy))+'px'};bar.onpointerup=()=>drag=false;bar.onpointercancel=()=>drag=false}
function initNotes(w){let notes=get('ogios_notes',[]),current=null;const list=$('#note-list',w),title=$('#note-title',w),body=$('#note-body',w),status=$('#note-status',w);function render(){list.innerHTML='';notes.forEach(n=>{let b=document.createElement('button');b.textContent=n.title||'Tanpa judul';b.classList.toggle('active',n.id===current);b.onclick=()=>select(n.id);list.append(b)})}function select(id){current=id;let n=notes.find(x=>x.id===id);title.value=n?.title||'';body.value=n?.body||'';render()}function save(){let n=notes.find(x=>x.id===current);if(!n)return;n.title=title.value;n.body=body.value;put('ogios_notes',notes);render();status.textContent='Tersimpan ✓'}$('#new-note',w).onclick=()=>{let n={id:Date.now(),title:'Catatan baru',body:''};notes.unshift(n);put('ogios_notes',notes);select(n.id);title.focus()};$('#delete-note',w).onclick=()=>{if(current===null)return;notes=notes.filter(n=>n.id!==current);current=notes[0]?.id??null;put('ogios_notes',notes);if(current)select(current);else{title.value='';body.value='';render()}status.textContent='Catatan dihapus'};title.oninput=save;body.oninput=save;if(notes.length)select(notes[0].id);else $('#new-note',w).click()}
function initCalc(w){let exp='';const d=$('#calc-display',w);function render(){d.value=exp||'0'}function calculate(s){let tokens=s.match(/(?:\d+\.?\d*|\.\d+)|[()+\-*/]/g);if(!tokens||tokens.join('')!==s.replace(/\s/g,''))throw Error();let i=0;function expr(){let v=term();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++],n=term();v=op==='+'?v+n:v-n}return v}function term(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){let op=tokens[i++],n=factor();if(op==='/'&&n===0)throw Error();v=op==='*'?v*n:v/n}return v}function factor(){if(tokens[i]==='+'){i++;return factor()}if(tokens[i]==='-'){i++;return -factor()}if(tokens[i]==='('){i++;let v=expr();if(tokens[i++]!==')')throw Error();return v}let n=Number(tokens[i++]);if(!Number.isFinite(n))throw Error();return n}let v=expr();if(i!==tokens.length||!Number.isFinite(v))throw Error();return String(Number(v.toFixed(8)))}w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='AC')exp='';else if(k==='DEL')exp=exp.slice(0,-1);else if(k==='='){try{exp=calculate(exp)}catch{toast('Ekspresi tidak valid');exp=''}}else{let c={'÷':'/','×':'*','−':'-'}[k]||k;if(/[+*/-]/.test(c)&&/[+*/-]$/.test(exp)){if(c==='-'&&/[*/]$/.test(exp))exp+=c;else exp=exp.slice(0,-1)+c}else exp+=c}render()})}
function initFiles(w){let files=get('ogios_files',[]),selected=null;const list=$('#file-list',w),editor=$('#file-editor',w);function render(){list.innerHTML='';if(!files.length)list.innerHTML='<p class="sub">Belum ada file. Buat file teks pertamamu.</p>';files.forEach(f=>{let row=document.createElement('div');row.className='fileitem';let name=document.createElement('span');name.textContent='📄 '+f.name;let b=document.createElement('button');b.textContent='Buka';b.onclick=()=>select(f.id);row.append(name,b);list.append(row)})}function select(id){selected=id;let f=files.find(x=>x.id===id);editor.style.display='block';$('#edit-file-name',w).value=f.name;$('#edit-file-body',w).value=f.body}$('#create-file',w).onclick=()=>{let name=$('#file-name',w).value.trim();if(!name){toast('Isi nama file dulu');return}if(!name.toLowerCase().endsWith('.txt'))name+='.txt';let f={id:Date.now(),name,body:''};files.unshift(f);put('ogios_files',files);$('#file-name',w).value='';render();select(f.id)};$('#save-file',w).onclick=()=>{let f=files.find(x=>x.id===selected);if(!f)return;f.name=$('#edit-file-name',w).value.trim()||'catatan.txt';f.body=$('#edit-file-body',w).value;put('ogios_files',files);render();toast('File disimpan')};$('#remove-file',w).onclick=()=>{files=files.filter(x=>x.id!==selected);selected=null;put('ogios_files',files);editor.style.display='none';render()};$('#download-file',w).onclick=()=>{let f=files.find(x=>x.id===selected);if(!f)return;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.body],{type:'text/plain'}));a.download=f.name;a.click();URL.revokeObjectURL(a.href)};render()}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));$('#start').onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==$('#start'))menu.classList.remove('open')});
function clock(){let d=new Date();$('#clock').innerHTML=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+'<br><span style="opacity:.65">'+d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+'</span>'}clock();setInterval(clock,1000);
</script>
</body></html>
